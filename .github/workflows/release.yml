name: Release

on:
  push:
    tags:
      - 'v*' # Trigger whenever a tag starting with 'v' is pushed (e.g., v0.1.1)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for the action to create a release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Automatically generates release notes from PR titles/commits
          draft: false
          prerelease: false